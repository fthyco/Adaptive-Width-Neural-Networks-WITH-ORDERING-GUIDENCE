name: Structural value grouped predictor

on:
  push:
    branches: ["feat/structural-value-counterfactual-pilot"]
    paths:
      - "experiments/structural_value/scripts/value_predictor.py"
      - "experiments/structural_value/tests/test_value_predictor.py"
      - ".github/workflows/structural-value-predictor.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  group-heldout-predictor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify no-leakage grouped predictor contracts
        run: |
          python -m pip install numpy pytest
          python -m compileall -q experiments/structural_value
          python -m pytest -q experiments/structural_value/tests/test_value_predictor.py
      - name: Retrieve all original G2 data without touching test set
        uses: actions/download-artifact@v4
        with:
          run-id: 44848340275
          github-token: ${{ github.token }}
          pattern: awn-grid96-*
          path: outputs/structural_value
          merge-multiple: true
      - name: Evaluate fixed ridge predictor on withheld trajectories
        run: |
          python -m experiments.structural_value.scripts.value_predictor \
            --root outputs/structural_value \
            --output outputs/structural_value/predictor_groupheldout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: awn-structural-value-groupheldout-predictor
          path: outputs/structural_value/predictor_groupheldout.json
          if-no-files-found: warn
          retention-days: 90
