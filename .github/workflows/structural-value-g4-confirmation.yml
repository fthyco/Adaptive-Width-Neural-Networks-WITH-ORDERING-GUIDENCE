name: Structural value G4 new-seed confirmation

on:
  push:
    branches: ["feat/structural-value-counterfactual-pilot"]
    paths:
      - "experiments/structural_value/g4_contract.py"
      - "experiments/structural_value/g4_frozen_policy.py"
      - "experiments/structural_value/scripts/g4_*.py"
      - "experiments/structural_value/tests/test_g4_lock.py"
      - ".github/workflows/structural-value-g4-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: structural-value-g4-locked-confirmation
  cancel-in-progress: false

jobs:
  frozen-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen policy and future-seed contract
        run: |
          python -m pip install numpy pytest
          python -m compileall -q experiments/structural_value
          python -m pytest -q experiments/structural_value/tests/test_g4_lock.py

  predictions-locked:
    needs: frozen-policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [Spiral, SpiralHard]
        seed: [20271, 20272, 20273]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original AWN CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install mlwiz==1.7.8 torch-geometric==2.8.1 numpy
          python -m pip install h5py datasets==3.6.0 transformers==4.57.6 openml==0.15.1 openml-pytorch==0.1.7 ucimlrepo==0.0.7
      - name: Download the original immutable G3 full-train candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 44849364139
          github-token: ${{ github.token }}
          name: awn-structural-value-groupheldout-predictor
          path: outputs/g3_frozen
      - name: Save only preintervention predictions and AWN state snapshots
        run: |
          python -m experiments.structural_value.scripts.g4_precommit \
            --dataset ${{ matrix.dataset }} --seed ${{ matrix.seed }} \
            --g3-artifact outputs/g3_frozen/predictor_groupheldout.json \
            --output outputs/g4_precommit/g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
      - name: Publish all predicted decisions before confirmation stage
        uses: actions/upload-artifact@v4
        with:
          name: g4-precommit-${{ matrix.dataset }}-seed${{ matrix.seed }}
          path: outputs/g4_precommit/g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 90

  outcomes-after-prediction:
    needs: predictions-locked
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [Spiral, SpiralHard]
        seed: [20271, 20272, 20273]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original AWN CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install mlwiz==1.7.8 torch-geometric==2.8.1 numpy
          python -m pip install h5py datasets==3.6.0 transformers==4.57.6 openml==0.15.1 openml-pytorch==0.1.7 ucimlrepo==0.0.7
      - name: Download the already published prediction and snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: g4-precommit-${{ matrix.dataset }}-seed${{ matrix.seed }}
          path: outputs/g4_precommit/g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
      - name: Check locked action and snapshot hashes before any future label
        run: |
          python -m experiments.structural_value.scripts.g4_confirm \
            --source outputs/g4_precommit/g4_${{ matrix.dataset }}_seed${{ matrix.seed }} \
            --output outputs/g4_confirmation/g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
      - name: Publish independently audited outcomes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
          path: outputs/g4_confirmation/g4_${{ matrix.dataset }}_seed${{ matrix.seed }}
          if-no-files-found: warn
          retention-days: 90

  locked-policy-confirmation:
    needs: outcomes-after-prediction
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aggregator dependencies
        run: python -m pip install numpy
      - name: Download all six independently audited new-seed outcome reports
        uses: actions/download-artifact@v4
        with:
          pattern: g4_*
          path: outputs/g4_confirmation
          merge-multiple: false
      - name: Fail-closed new-seed confirmation and compare locked policy to AWN
        run: |
          python -m experiments.structural_value.scripts.g4_aggregate \
            --root outputs/g4_confirmation \
            --output outputs/g4_confirmation/g4_final_confirmation.json
      - uses: actions/upload-artifact@v4
        with:
          name: g4-frozen-ridge-prospective-confirmation
          path: outputs/g4_confirmation/g4_final_confirmation.json
          if-no-files-found: error
          retention-days: 90
