name: Structural value native AWN G1

on:
  pull_request:
    paths:
      - "experiments/structural_value/**"
      - ".github/workflows/structural-value-g1.yml"
  push:
    branches:
      - "feat/structural-value-counterfactual-pilot"
    paths:
      - "experiments/structural_value/**"
      - ".github/workflows/structural-value-g1.yml"
  workflow_dispatch:

jobs:
  native-awn-action-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install matching CPU PyTorch and AWN dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install mlwiz==1.7.8 torch-geometric==2.8.1 numpy pytest
      - name: Test genuine AWN positional versus coupled interventions
        run: python -m pytest -q experiments/structural_value/tests/test_native_g1.py
      - name: Export native action-control report
        run: python -m experiments.structural_value.scripts.verify_g1 --seed 42 --output g1-native-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-awn-g1-report
          path: g1-native-report.json
