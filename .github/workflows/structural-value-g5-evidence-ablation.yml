name: Structural value G5A fresh same-checkpoint evidence ablation

# Original six fresh-cohort data artifacts were completed in run 44857181035.
# Do not rerun same seeds after observing the six paired teacher-label sets.
# Recovery workflow repairs only the G5A report serializer.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify predecision feature and grouped-fold contracts
        run: |
          python -m pip install numpy pytest
          python -m compileall -q experiments/structural_value
          python -m pytest -q experiments/structural_value/tests/test_g5_evidence.py experiments/structural_value/tests/test_g5_fresh_study.py

  fresh-same-checkpoint-cohorts:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dataset: [Spiral, SpiralHard]
        seed: [20331, 20332, 20333]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original AWN CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install mlwiz==1.7.8 torch-geometric==2.8.1 numpy
          python -m pip install h5py datasets==3.6.0 transformers==4.57.6 openml==0.15.1 openml-pytorch==0.1.7 ucimlrepo==0.0.7
      - name: Capture proposed evidence and exact-checkpoint paired future labels
        run: |
          python -m experiments.structural_value.scripts.g5_same_checkpoint_study \
            --dataset ${{ matrix.dataset }} --seed ${{ matrix.seed }} \
            --output outputs/g5/g5_${{ matrix.dataset }}_seed${{ matrix.seed }}
      - name: Publish raw paired experiment, before-action records and audits
        uses: actions/upload-artifact@v4
        with:
          name: g5-cohort-${{ matrix.dataset }}-seed${{ matrix.seed }}
          path: outputs/g5/
          if-no-files-found: error
          retention-days: 90

  paired-group-heldout-ablation:
    needs: fresh-same-checkpoint-cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify zero future-label leakage and matched baseline contract
        run: |
          python -m pip install numpy pytest
          python -m pytest -q experiments/structural_value/tests/test_g5_evidence.py experiments/structural_value/tests/test_g5_fresh_study.py experiments/structural_value/tests/test_value_predictor.py
      - name: Retrieve all fresh G5A cohorts with preaction and raw outcome data
        uses: actions/download-artifact@v4
        with:
          pattern: g5-cohort-*
          path: outputs/g5/
          merge-multiple: true
      - name: Independently re-audit raw forks and compare both predictor designs
        run: |
          python -m experiments.structural_value.scripts.g5_fresh_ablation \
            --root outputs/g5 --output outputs/results/g5a_fresh_evidence_ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: awn-g5a-fresh-evidence-exploratory-ablation
          path: outputs/results/g5a_fresh_evidence_ablation.json
          if-no-files-found: error
          retention-days: 90
