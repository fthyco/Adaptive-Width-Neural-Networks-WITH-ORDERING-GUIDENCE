name: Evidence sweep tests

on:
  pull_request:
    paths:
      - "experiments/bottleneck_triggered/evidence_sweep/**"
      - ".github/workflows/evidence-sweep-tests.yml"
  push:
    branches:
      - "exp/evidence-sweep-two-phases"
    paths:
      - "experiments/bottleneck_triggered/evidence_sweep/**"
      - ".github/workflows/evidence-sweep-tests.yml"
  workflow_dispatch:

jobs:
  evidence-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pytest
      - name: Run isolated screening tests
        run: python -m pytest -q experiments/bottleneck_triggered/evidence_sweep/tests
