name: Structural value isolated tests

on:
  pull_request:
    paths:
      - "experiments/structural_value/**"
      - ".github/workflows/structural-value-tests.yml"
  push:
    branches:
      - "feat/structural-value-counterfactual-pilot"
    paths:
      - "experiments/structural_value/**"
      - ".github/workflows/structural-value-tests.yml"
  workflow_dispatch:

jobs:
  checkpoint-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy pytest
      - name: Run deterministic fork/paired-label tests
        run: python -m pytest -q experiments/structural_value/tests/test_checkpoint_and_rollouts.py experiments/structural_value/tests/test_pilot_audit.py
